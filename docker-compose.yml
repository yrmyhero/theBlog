version: '3.8'

services:
  # ---------- 1. MySQL 数据库 ----------
  db:
    image: mysql:8.0
    container_name: my_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123        # 建议通过 .env 文件管理，这里先硬写测试
      MYSQL_DATABASE: mydb
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- 2. FastAPI 后端 ----------
  backend:
    build: ./backend                # 指向后端文件夹
    container_name: fastapi_app
    restart: always
    environment:
      DATABASE_URL: mysql+asyncmy://myuser:mypassword@db:3306/mydb
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ---------- 3. React 前端 (Apache) ----------
  frontend:
    build: ./frontend               # 指向前端文件夹
    container_name: react_app
    restart: always
    ports:
      - "3000:80"                   # 访问 localhost:3000 即可
    depends_on:
      - backend

volumes:
  mysql_data: